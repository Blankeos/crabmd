[package]
name = "crabmd"
version = "0.0.2"
edition = "2021"
publish = false
license = "MIT"
description = "A fast native GPUI markdown writer"
authors = ["Carlo Taleon <blankeos>"]
repository = "https://github.com/Blankeos/crabmd"
homepage = "https://github.com/Blankeos/crabmd"
readme = "README.md"
keywords = ["markdown", "editor", "gpui", "wysiwyg"]
categories = ["text-editors", "command-line-utilities"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "src/**/*.rs",
    "README.md",
    "LICENSE",
    "assets/**",
    "themes/**/*.json",
]

[[bin]]
name = "crabmd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui = { git = "https://github.com/zed-industries/zed" }
reqwest_client = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "b4393e22d3a04a880bc187dfdabca9b1eeee270a", features = [
    "tree-sitter",
    "tree-sitter-markdown",
    "tree-sitter-rust",
    "tree-sitter-javascript",
    "tree-sitter-python",
] }
pulldown-cmark = "0.13"
mermaid-rs-renderer = { version = "0.3", default-features = false }
yscv-video = "0.1"
smallvec = "1"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
# Pin: tinyvec 1.13.0 is broken on rustc 1.98 (missing `vec` macro import).
# Direct pin forces 1.12.0 even on unlocked `cargo install --path .` resolves.
tinyvec = "=1.12.0"

[profile.dev]
debug = 1

[profile.dist]
inherits = "release"
lto = "thin"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[package.metadata.bundle]
name = "CrabMD"
identifier = "ai.blankeos.crabmd"
icon = ["assets/app-icon.png"]

[package.metadata.dist]
# publish = false above opts out of crates.io, but that also hides the
# binary from cargo-dist. Re-enable dist explicitly.
dist = true
