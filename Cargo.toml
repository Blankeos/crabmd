[package]
name = "crabmd"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A fast native GPUI markdown writer"
authors = ["Carlo Taleon <blankeos>"]
repository = "https://github.com/Blankeos/crabmd"
homepage = "https://github.com/Blankeos/crabmd"
readme = "README.md"
keywords = ["markdown", "editor", "gpui", "wysiwyg"]
categories = ["text-editors", "command-line-utilities"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/src/**/*.rs",
    "/README.md",
    "/LICENSE",
    "/assets/**",
    "/themes/**/*.json",
]

[[bin]]
name = "crabmd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", features = [
    "tree-sitter",
    "tree-sitter-markdown",
    "tree-sitter-rust",
    "tree-sitter-javascript",
    "tree-sitter-python",
] }
pulldown-cmark = "0.13"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
debug = 1

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[package.metadata.bundle]
name = "CrabMD"
identifier = "ai.blankeos.crabmd"
icon = ["assets/app-icon.png"]
