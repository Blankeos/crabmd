[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# CI backends to support
ci = "github"
# The installers to generate for each app.
# macOS is distributed ONLY via the Homebrew cask (see
# .github/workflows/macos-cask.yml + scripts/write-cask.sh), which wraps the
# macOS cargo-dist archives in CrabMD.app. The cargo-dist "homebrew" formula
# is intentionally disabled: it conflicts with the cask (same `crabmd` binary
# name, two app identities) and confuses Spotlight/Dock/Open-With.
# Linux uses the shell installer; `brew` formula distribution is retired.
installers = ["shell"]
# No cargo-dist tap publishing. The cask workflow is the sole writer to
# blankeos/homebrew-tap (Casks/crabmd.rb) and also removes the legacy
# Formula/crabmd.rb. Keeping `tap`/`publish-jobs` here would regenerate a
# `publish-homebrew-formula` job in release.yml — do not re-add.
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
# Native ARM runner: aarch64-linux links C system libs (xkbcommon, xcb)
# which cross-compile via zigbuild can't find. Native build fixes that.
[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
# GPUI/Linux system libs (Zed script/linux set, trimmed to link deps).
# Without these, Linux link fails with:
#   rust-lld: error: unable to find library -lxkbcommon
[dist.dependencies.apt]
libxkbcommon-dev = "*"
libxkbcommon-x11-dev = "*"
libx11-xcb-dev = "*"
libxcb1-dev = "*"
libfontconfig-dev = "*"
libfreetype-dev = "*"
libwayland-dev = "*"
