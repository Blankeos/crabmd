[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew", "shell"]
# Publish the Homebrew formula to blankeos/homebrew-tap
tap = "blankeos/homebrew-tap"
# Publish package-manager metadata after release assets are uploaded
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
# Native ARM runner: aarch64-linux links C system libs (xkbcommon, xcb)
# which cross-compile via zigbuild can't find. Native build fixes that.
[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
# GPUI/Linux system libs (Zed script/linux set, trimmed to link deps).
# Without these, Linux link fails with:
#   rust-lld: error: unable to find library -lxkbcommon
[dist.dependencies.apt]
libxkbcommon-dev = "*"
libxkbcommon-x11-dev = "*"
libx11-xcb-dev = "*"
libxcb1-dev = "*"
libfontconfig-dev = "*"
libfreetype-dev = "*"
libwayland-dev = "*"
