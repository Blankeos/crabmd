# npm distribution is RETIRED.
#
# macOS ships ONLY via the Homebrew cask (see macos-cask.yml); Linux via the
# shell installer. The npm wrapper (`npm/bin.js` + `npm/install.js`) downloads
# the same cargo-dist archives but registers a conflicting ~/Applications copy
# on macOS, forking LaunchServices identity (two Dock icons, Spotlight
# confusion). Publishing new npm versions is therefore disabled: this workflow
# no longer runs on tag pushes. Existing npm versions remain installable for
# now; new releases are NOT published to npm. To fully retire, a maintainer
# must run `npm deprecate` manually (requires npm credentials, cannot be done
# via file change) — see report.
#
# Kept as a manual-only workflow so `workflow_dispatch` can still verify that
# no publish happens, without blocking releases.

name: Publish registries (retired)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag (publish is disabled; this only verifies)
        required: true
        type: string

concurrency:
  group: publish-registries-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  retired:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: npm publishing is retired
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          echo "npm publishing is retired for ${TAG}."
          echo "macOS: brew install --cask blankeos/tap/crabmd"
          echo "Linux: curl --proto \"=https\" --tlsv1.2 -LsSf https://github.com/Blankeos/crabmd/releases/latest/download/crabmd-installer.sh | sh"
          echo "Existing npm versions are left as-is; no new version is published."
